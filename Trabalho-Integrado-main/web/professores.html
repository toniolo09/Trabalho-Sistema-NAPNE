<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sistema NAPNE - Gestão de Servidores</title>
    <link rel="stylesheet" href="css/alunos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <header>
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Sistema NAPNE</span>
                </div>
                <nav>
                    <ul>
                        <li><a href="dashboard.html">Dashboard</a></li>
                        <li><a href="peis.html">PEIs</a></li>
                        <li><a href="alunos.html">Estudantes</a></li>
                        <li><a href="professores.html" class="active">Servidores</a></li>
                        <li><a href="cursos.html">Cursos</a></li>
                        <li><a href="necessidades.html">Necessidades</a></li>
                        <li><a href="#" id="logout">Sair</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header">
                <h1>Gestão de Servidores</h1>
                <button class="btn btn-primary" id="newTeacherBtn">
                    <i class="fas fa-plus"></i> Novo Servidor
                </button>
            </div>

            <div class="content-section">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>SIAPE</th>
                                <th>Nome</th>
                                <th>Email</th>
                                <th>CPF</th>
                                <th>Telefone</th>
                                <th>Tipo</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="teachers-table-body">
                            <!-- Dados serão preenchidos via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Novo/Editar Servidor -->
    <div class="modal" id="teacherModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Novo Servidor</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="teacherForm">
                    <input type="hidden" id="teacherId" />

                    <div class="form-row">
                        <div class="form-group">
                            <label for="siape">SIAPE *</label>
                            <input type="number" id="siape" placeholder="Digite o SIAPE" required />
                        </div>
                        <div class="form-group">
                            <label for="tipo">Tipo *</label>
                            <select id="tipo" required>
                                <option value="">Selecione o tipo</option>
                                <option value="Docente">Docente</option>
                                <option value="CAE">CAE</option>
                                <option value="NAPNE">NAPNE</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="teacherName">Nome Completo *</label>
                            <input type="text" id="teacherName" required />
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" placeholder="servidor@ifrs.edu.br" required />
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cpf">CPF *</label>
                            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required />
                        </div>
                        <div class="form-group">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" placeholder="(00) 00000-0000" />
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancelTeacher">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Servidor</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>Sistema NAPNE &copy; 2025 - Desenvolvido para inclusão educacional</p>
        </div>
    </footer>

    <script src="js/api-config.js"></script>
    <script src="js/professores.js"></script>
</body>
</html>
